openapi: 3.0.3
info:
  title: Customer Portal - Customer Login API
  description: Public authentication API endpoint for customer login in the Customer Portal application.
  version: "1"
x-story: US-002
x-source-specification: docs/specifications/US-002-spec.md
x-source-specification-version: 1
x-produced-by: openapi-designer

servers:
  - url: /api/v1
    description: Current API version root

paths:
  /auth/login:
    post:
      summary: Customer login
      description: |
        Authenticates a registered customer using email and password.
        The endpoint is public and does not require prior authentication.
        On success, establishes a Spring Security session context and session cookie,
        returning HTTP 200 OK with authenticated customer identity details.
      operationId: login
      tags:
        - Authentication
      security: [] # Public endpoint - unauthenticated per SC-4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Customer successfully authenticated. Session established.
          headers:
            Set-Cookie:
              description: HTTP session cookie containing the JSESSIONID.
              schema:
                type: string
                example: JSESSIONID=node01abcdef123456; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error or malformed request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Authentication failed (invalid credentials, unregistered account, or disabled account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-02T13:25:00Z"
                status: 401
                error: Unauthorized
                message: "Invalid email or password"
                path: /api/v1/auth/login
        '415':
          description: Unsupported Media Type (Content-Type header is not application/json).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-02T13:25:00Z"
                status: 415
                error: Unsupported Media Type
                message: "Content-Type must be application/json"
                path: /api/v1/auth/login
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-02T13:25:00Z"
                status: 500
                error: Internal Server Error
                message: "An unexpected error occurred"
                path: /api/v1/auth/login

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Registered email address for the customer account.
          example: customer@example.com
        password:
          type: string
          format: password
          maxLength: 72
          description: Plaintext password submitted for authentication.
          example: "SecurePass123!"

    LoginResponse:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: integer
          format: int64
          description: Unique surrogate identifier of the authenticated customer.
          example: 1
        email:
          type: string
          format: email
          description: Normalized email address of the customer.
          example: customer@example.com
        role:
          type: string
          enum:
            - CUSTOMER
            - ADMIN
          description: Assigned role of the authenticated customer.
          example: CUSTOMER

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Name of the invalid request field.
          example: email
        message:
          type: string
          description: Validation error message for the field.
          example: Email is required

    ValidationErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-02T13:25:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: "Validation failed"
        path:
          type: string
          example: /api/v1/auth/login
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-02T13:25:00Z"
        status:
          type: integer
          example: 401
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: "Invalid email or password"
        path:
          type: string
          example: /api/v1/auth/login