openapi: 3.0.3
info:
  title: Customer Portal - View Customer Profile API
  description: API contract for viewing customer profile data in the Customer Portal application.
  version: "1"
x-story: US-003
x-source-specification: docs/specifications/US-003-spec.md
x-source-specification-version: 1
x-produced-by: openapi-designer

servers:
  - url: /api/v1
    description: Current API version root

paths:
  /customers/{id}:
    get:
      summary: View customer profile
      description: |
        Retrieves the profile information of an authenticated customer by customer ID.
        Requires an active authenticated session. Access to any profile other than
        the authenticated customer's own profile is strictly denied with HTTP 403 Forbidden.
        Sensitive credentials (password, passwordHash) are never returned.
      operationId: getCustomerProfile
      tags:
        - Customer Profile
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric surrogate ID of the customer whose profile is requested.
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 1
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Invalid path parameter format (e.g. non-numeric string).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-05T10:05:00Z"
                status: 400
                error: "Bad Request"
                message: "Failed to convert value of type 'java.lang.String' to required type 'java.lang.Long'"
                path: "/api/v1/customers/abc"
        '401':
          description: Unauthenticated request (missing or invalid session).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-05T10:05:00Z"
                status: 401
                error: "Unauthorized"
                message: "Full authentication is required to access this resource"
                path: "/api/v1/customers/1"
        '403':
          description: Access denied due to ownership mismatch (attempting to view another customer's profile).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-05T10:05:00Z"
                status: 403
                error: "Forbidden"
                message: "Access denied"
                path: "/api/v1/customers/2"
        '404':
          description: Customer record not found for the caller's ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-05T10:05:00Z"
                status: 404
                error: "Not Found"
                message: "Customer not found with id: 1"
                path: "/api/v1/customers/1"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-09-05T10:05:00Z"
                status: 500
                error: "Internal Server Error"
                message: "An unexpected error occurred"
                path: "/api/v1/customers/1"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie established during authentication.

  schemas:
    CustomerResponse:
      type: object
      description: Public customer profile details excluding sensitive authentication credentials.
      required:
        - id
        - email
        - role
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Unique customer surrogate identifier.
          example: 1
        email:
          type: string
          format: email
          description: Registered email address of the customer.
          example: customer@example.com
        role:
          type: string
          description: Assigned user role.
          example: CUSTOMER
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the customer was registered in UTC.
          example: "2026-09-05T10:00:00Z"

    ErrorResponse:
      type: object
      description: Standardized error envelope conforming to api-conventions.md AC-6.
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp when the error occurred.
          example: "2026-09-05T10:05:00Z"
        status:
          type: integer
          description: HTTP status code.
          example: 403
        error:
          type: string
          description: Short HTTP error phrase.
          example: "Forbidden"
        message:
          type: string
          description: Safe, user-facing error explanation without sensitive internals.
          example: "Access denied"
        path:
          type: string
          description: Requested URI path.
          example: "/api/v1/customers/2"
